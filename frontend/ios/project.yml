name: TPD

options:
  bundleIdPrefix: com.hanyi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Applied to every target. SWIFT_VERSION 6.0 selects the Swift 6 language mode,
# which turns on complete strict-concurrency checking; all sources must be
# written to satisfy it. No target declares a run-script phase, so user script
# sandboxing stays enabled.
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  TPD:
    type: application
    platform: iOS
    # Directory glob, deliberately. Every Swift file, asset and generated
    # .mlpackage under TPD/ is picked up by `xcodegen generate` without editing
    # this file — that keeps parallel feature branches from all colliding here.
    sources:
      - path: TPD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanyi.TPD
        PRODUCT_NAME: TPD
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    info:
      path: TPD/Info.plist
      properties:
        CFBundleDisplayName: TPD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Live Camera View streams frames straight into the Core ML pipeline.
        NSCameraUsageDescription: >-
          TPD analyses the live camera feed on device to detect your tennis
          stroke. Frames are never uploaded or stored.
        # Add-only: overlaid videos are written back to the camera roll.
        # PhotosPicker runs out of process, so the read key is not required and
        # is intentionally omitted.
        NSPhotoLibraryAddUsageDescription: >-
          TPD saves videos with the prediction overlay burned in to your photo
          library.
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64

  TPDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TPDTests
        optional: true
    dependencies:
      - target: TPD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanyi.TPDTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TPD:
    build:
      targets:
        TPD: all
        TPDTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TPDTests
